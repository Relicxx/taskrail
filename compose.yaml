name: taskrail
x-app: &app
  build: .
  image: taskrail:local
  environment: &env
    DATABASE_URL: postgres://taskrail:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/taskrail?sslmode=disable
    API_KEYS: ${API_KEYS:?set API_KEYS}
    DEMO_MODE: ${DEMO_MODE:-false}
  depends_on:
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: taskrail
      POSTGRES_DB: taskrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskrail -d taskrail"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
  worker-a:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *env
      WORKER_ID: worker-a
  worker-b:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *env
      WORKER_ID: worker-b
volumes:
  postgres-data:
