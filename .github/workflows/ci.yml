name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: taskrail
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskrail
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U taskrail" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://taskrail:test@localhost:5432/taskrail?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: cp .env.example .env && docker compose config --quiet
